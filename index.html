<title>Mohammad Mojarradi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&family=Vazirmatn:wght@300;400;500&display=swap">
<style>
html { background: #0b0b0c; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one narrow column. Robot hero, gold ring with the MM monogram overlapping its edge, name block, four focus tiles, short bio, links. Black and gold, a deliberate single look. */
:root {
  color-scheme: dark;
  --bg: #0b0b0c;
  --surface: #131314;
  --ink: #ece6da;
  --muted: #9b958a;
  --gold: #d4aa5f;
  --gold-hi: #ecd29a;
  --gold-lo: #b78b43;
  --line: rgba(212, 170, 95, 0.24);
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body: "Jost", system-ui, sans-serif;
  --font-fa: "Vazirmatn", Tahoma, system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 300;
  font-size: 15px;
  line-height: 1.7;
  padding-block: 16px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
.wrap[lang="fa"] { font-family: var(--font-fa); font-size: 14.5px; }

.top { display: flex; justify-content: flex-end; }
.lang {
    font: 500 12px/1 var(--font-body); letter-spacing: 0.12em;
  color: var(--gold); background: rgba(11,11,12,0.7);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.wrap[lang="en"] .lang { font-family: var(--font-fa); letter-spacing: 0; font-size: 13px; }
.lang:hover { border-color: var(--gold); }
.lang:focus-visible, a.item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.id { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;  }
.ring { width: 108px; height: 108px; border-radius: 50%; border: 1px solid var(--gold-lo); background: var(--bg); display: grid; place-items: center; }
.ring img { width: 58px; height: auto; display: block; }
h1 {
  margin: 6px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 27px; line-height: 1.15;
  letter-spacing: 0.14em; text-wrap: balance;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.role { margin: 0; color: var(--gold); font-size: 15px; letter-spacing: 0.04em; text-wrap: balance; }
.rule { width: 56px; height: 1px; background: var(--gold-lo); margin-block: 4px; }
.tagline { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 12px; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
.tagline span + span::before { content: "|"; margin-inline-end: 12px; color: var(--gold-lo); }
.wrap[lang="fa"] h1 { font-family: var(--font-fa); font-weight: 500; letter-spacing: 0; font-size: 25px; }
.wrap[lang="fa"] .role { letter-spacing: 0; }
.wrap[lang="fa"] .tagline { letter-spacing: 0; text-transform: none; font-size: 12.5px; }

.focus { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px 10px 14px; text-align: center; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tile img { width: 52px; height: 52px; display: block; }
.tile span { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1.4; overflow-wrap: anywhere; }
.wrap[lang="fa"] .tile span { letter-spacing: 0; text-transform: none; font-size: 13px; }

.about { margin: 0; text-align: center; color: var(--muted); text-wrap: pretty; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group h2 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
.wrap[lang="fa"] .group h2 { letter-spacing: 0; text-transform: none; font-size: 13px; }
.item { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .15s; }
a.item:hover, button.item:hover { border-color: var(--gold); }
button.item { font: inherit; color: inherit; text-align: start; width: 100%; cursor: pointer; }
button.item:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.side { flex: none; font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; color: var(--gold); white-space: nowrap; }
.wrap[lang="fa"] .side { letter-spacing: 0; font-size: 12px; }
.dsc.val { direction: ltr; text-align: start; unicode-bidi: isolate; }
.wrap[dir="rtl"] .dsc.val { text-align: right; }
.ic { flex: none; width: 40px; height: 40px; display: grid; place-items: center; color: var(--gold); border: 1px solid var(--line); border-radius: 50%; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ttl { font-weight: 400; overflow-wrap: anywhere; }
.dsc { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.arrow { flex: none; color: var(--gold); }
.wrap[dir="rtl"] .arrow { transform: scaleX(-1); }
@media (prefers-reduced-motion: reduce) { .item { transition: none; } }
</style>
